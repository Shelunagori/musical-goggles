# Repository root: shared workspace packages and migration files must be included.
services:
  - type: web
    name: musical-goggles-api
    runtime: node
    plan: free
    autoDeployTrigger: off
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter @mg/api build
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.23.3
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: require
      - key: DATABASE_POOL_MAX
        value: '5'
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_API_TOKEN
        generateValue: true
      - key: EMBEDDING_ENABLED
        value: 'false'
      - key: EMBEDDING_ALLOW_DOWNLOAD
        value: 'false'
      - key: SEARCH_DEBUG
        value: 'false'
      - key: LOG_LEVEL
        value: info
# Optional DEEPGRAM_API_KEY and DATABASE_SSL_CA: set privately in Render.
# Migrations/seed run separately, never on each build/start.
